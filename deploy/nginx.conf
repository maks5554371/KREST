# KRET-Manufaktur – nginx reverse proxy vor `next start` (127.0.0.1:3000).
# Ablage: /etc/nginx/sites-available/kret-manufaktur.conf
#   sudo ln -s /etc/nginx/sites-available/kret-manufaktur.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# TLS danach automatisch: sudo certbot --nginx -d kret-manufaktur.de -d www.kret-manufaktur.de
# (certbot ergänzt den 443-Server + HTTP->HTTPS-Redirect in dieser Datei.)

upstream kret_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name kret-manufaktur.de www.kret-manufaktur.de;

    # Admin-Uploads: Body-Limit anheben (nginx-Default ist 1 MB).
    client_max_body_size 25m;

    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css application/javascript application/json
        image/svg+xml application/xml font/woff2;

    # Immutable Assets aus dem Next-Build lange cachen.
    location /_next/static/ {
        proxy_pass http://kret_app;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Alles Übrige an Next weiterreichen (inkl. /uploads, /api, Bilder-Optimierung).
    location / {
        proxy_pass http://kret_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}

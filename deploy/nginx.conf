# KRET-Manufaktur – nginx reverse proxy vor `next start` (127.0.0.1:3000).
# Dev-Variante: OHNE Domain, OHNE HTTPS – erreichbar direkt über die Server-IP.
#
# Ablage: /etc/nginx/sites-available/kret.conf
#   sudo ln -s /etc/nginx/sites-available/kret.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default   # Default-Server entfernen
#   sudo nginx -t && sudo systemctl reload nginx
# Aufruf danach:  http://<SERVER-IP>
#
# Sobald eine Domain existiert: server_name auf die Domain setzen und TLS
# ergänzen (sudo certbot --nginx -d <domain>) – siehe DEPLOY.md.

upstream kret_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    # default_server: nimmt Anfragen an die nackte IP entgegen (ohne Host-Name).
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Admin-Uploads: Body-Limit anheben (nginx-Default ist 1 MB).
    client_max_body_size 25m;

    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css application/javascript application/json
        image/svg+xml application/xml font/woff2;

    # Immutable Assets aus dem Next-Build lange cachen.
    location /_next/static/ {
        proxy_pass http://kret_app;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Alles Übrige an Next weiterreichen (inkl. /uploads, /api, Bilder-Optimierung).
    location / {
        proxy_pass http://kret_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
